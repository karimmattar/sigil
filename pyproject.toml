[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-agent"
dynamic = ["version"]  # single source: sigil.__version__
description = "Sigil: local desktop agent bridging a web system and PKCS#11 hard tokens (Egypt Trust / DeltaTrust ePass2003, SafeNet, OpenSC…) for PDF and CMS signing."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.165",
    "starlette>=1.10",  # CORSMiddleware(allow_private_network=...)
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyHanko[pkcs11]>=0.38.2",
    "pyhanko-certvalidator>=0.33",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff==0.17.6", "mypy==2.4.1", "cryptography>=42"]
build = ["pyinstaller>=6.6"]

[project.scripts]
sigil = "sigil.desktop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "sigil.__version__" }

[tool.setuptools.package-data]
sigil = ["py.typed"]

# --------------------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests against a real PKCS#11 module (SoftHSM2); skipped when unavailable",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Starlette suggests the new 'httpx2' package for TestClient; plain httpx still works.
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["sigil"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT", "C4", "RET", "ARG", "TID"]
ignore = [
    "PLR0913",  # use-case / route signatures legitimately take many parameters
    "PLR2004",  # magic values are fine in small, well-named contexts
    "S101",     # assert is used for invariants in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ARG", "N802"]
"packaging/*.spec" = ["F821", "N999"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sigil"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pkcs11.*", "pyhanko.*", "pyhanko_certvalidator.*", "asn1crypto.*", "pystray.*", "PIL.*", "winreg"]
ignore_missing_imports = true
