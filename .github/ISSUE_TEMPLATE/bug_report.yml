name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your PIN, private keys or signed documents.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error response
      description: The JSON error returned by Sigil (it contains a `code`), if any.
      render: json
  - type: textarea
    id: diagnose
    attributes:
      label: Output of `sigil diagnose --json`
      description: Contains no secrets — driver, token and certificate details only.
      render: json
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: token
    attributes:
      label: Token and provider
      placeholder: e.g. HyperPKI HYP2003 from Egypt Trust
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `agent.log` (see README for the log folder). Remove anything sensitive.
      render: text
