name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install SoftHSM2 (software PKCS#11 token for integration tests)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y softhsm2
          else
            brew install softhsm
          fi

      - name: Install
        run: python -m pip install -e ".[dev,tray]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type-check
        run: mypy

      - name: Tests (unit + SoftHSM integration where available)
        run: pytest --cov --cov-report=term --cov-report=xml

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: older glibc so the binary also runs on older distributions.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash packaging/build.sh

      - name: Smoke-test the binary
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) BIN="dist/sigil.exe" ;;
            macOS)   BIN="dist/Sigil.app/Contents/MacOS/sigil" ;;
            *)       BIN="dist/sigil" ;;
          esac
          "$BIN" version
          "$BIN" diagnose --json || test $? -eq 3   # 3 = no token driver on CI (expected)

      - name: Stage the downloadable file
        shell: bash
        run: |
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) cp dist/sigil.exe release/sigil-windows-x64.exe ;;
            macOS)   ditto -c -k --keepParent "dist/Sigil.app" release/Sigil-macos-arm64.zip ;;
            *)       tar -C dist -czf release/sigil-linux-x64.tar.gz sigil ;;  # keeps +x
          esac
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: sigil-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  all-checks:
    # The single status check required by the main-branch ruleset
    # (.github/rulesets/main.json), so the matrix can change without editing the rules.
    name: All checks passed
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every test and build job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed ($result)."
              exit 1
            fi
          done

  release:
    name: Publish GitHub Release
    # Only for version tags such as v1.0.0 (or v1.1.0-rc1 for a pre-release).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: all-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sigil/__init__.py)
          CODENAME=$(sed -n 's/^__codename__ = "\(.*\)"/\1/p' src/sigil/__init__.py)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $VERSION in src/sigil/__init__.py"
            exit 1
          fi
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          pattern: sigil-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum -- * | tee SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          CODENAME: ${{ steps.version.outputs.codename }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Sigil $GITHUB_REF_NAME — $CODENAME" --generate-notes --verify-tag $PRERELEASE
